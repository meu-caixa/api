databaseChangeLog:
  - changeSet:
      id: 1
      author: adilson
      changes:
        - sql:
            dbms: postgresql
            splitStatements: false
            endDelimiter: ;
            sql: CREATE TYPE income_type AS ENUM ('SALARIO','RENDA_EXTRA')
  - changeSet:
      id: 2
      author: adilson
      changes:
        - createTable:
            tableName: monthly_income
            columns:
              - column:
                  name: id
                  type: bigint
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_monthly_income_id
                    nullable: false
                    autoIncrement: true
              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: bank_name
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: amount
                  type: decimal(10,2)
                  constraints:
                    nullable: false
              - column:
                  name: category
                  type: income_type
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: true
              - column:
                  name: updated_at
                  type: timestamp
                  constraints:
                    nullable: true
  - changeSet:
      id: 3
      author: adilson
      changes:
        - addForeignKeyConstraint:
            baseColumnNames: user_id
            baseTableName: monthly_income
            constraintName: fk_monthly_income_user_id
            referencedColumnNames: id
            referencedTableName: users
            onDelete:  CASCADE
            onUpdate:  RESTRICT



