name: PR - Check Pipeline
run-name: Running - ${{ github.event_name }}
on:
  pull_request:
    types:
      - opened
      - synchronize
jobs:
  pr-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout of code
        uses: actions/checkout@v4

      - name: Setup do JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache do Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle

      - name: Exec Permission of wrapper
        run: chmod +x gradlew

      - name: Build + Tests + Lint + Coverage
        if: always()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew clean build check jacocoTestReport printCoverage sonar